[pytest]
markers =
    unit: Unit tests that don't require integration components
    integration: Tests that require integration components
    slow: Tests that are slow to run

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Show test output
addopts = -v